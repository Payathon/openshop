# OpenShop on one machine: app → Postgres, plus a daily backup. HTTPS comes from one of two
# overrides, picked with COMPOSE_FILE in .env (see docs/deploy.md):
#   docker-compose.edge.yml    shared server: join the `edge` network; the edge Caddy (hive repo,
#                              deploy/edge, in /opt/edge) proxies $OPENSHOP_DOMAIN to the app
#   docker-compose.caddy.yml   OpenShop alone on the machine: its own Caddy on 80/443
# Add docker-compose.build.yml to build the image from a checkout instead of pulling it.
# In the directory with .env:  ./up.sh   (CD runs the same script)

name: openshop

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  app:
    image: ${OPENSHOP_IMAGE:-ghcr.io/payathon/openshop:latest}
    restart: unless-stopped
    init: true
    # main.ts finishes the payment sweep and open requests within 8s of SIGTERM.
    stop_grace_period: 15s
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://${OPENSHOP_DOMAIN:?set OPENSHOP_DOMAIN in .env}}
      DATABASE_URL: postgres://openshop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/openshop
      PAYMENT_SYNC_MS: ${PAYMENT_SYNC_MS:-10000}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      SEED: ${SEED:-1}
      SEED_ACCOUNTS: ${SEED_ACCOUNTS:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openshop
      POSTGRES_DB: openshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openshop", "-d", "openshop"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Dumps the database once a day into ./backups on the host, keeping BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: openshop
      PGDATABASE: openshop
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-19}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      # Uploaded images are backed up alongside the database (read-only).
      - uploads:/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  uploads:
